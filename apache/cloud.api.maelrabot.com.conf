<VirtualHost *:80>
    ServerName cloud.api.maelrabot.com
    ServerAdmin webmaster@maelrabot.com

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName cloud.api.maelrabot.com
    ServerAdmin webmaster@maelrabot.com

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/maelrabot.com.crt
    SSLCertificateKeyFile /etc/ssl/private/maelrabot.com.key
    SSLCertificateChainFile /etc/ssl/certs/maelrabot.com.chain.crt

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer-when-downgrade"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Proxy configuration
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Timeout settings
    ProxyTimeout 300
    ProxyBadHeader Ignore

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/cloud.api.maelrabot.com_error.log
    CustomLog ${APACHE_LOG_DIR}/cloud.api.maelrabot.com_access.log combined

    # Enable required modules
    LoadModule proxy_module modules/mod_proxy.so
    LoadModule proxy_http_module modules/mod_proxy_http.so
    LoadModule headers_module modules/mod_headers.so
    LoadModule rewrite_module modules/mod_rewrite.so
    LoadModule ssl_module modules/mod_ssl.so
</VirtualHost>