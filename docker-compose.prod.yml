services:
  # PHP-FPM container for Symfony
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: symfony_php_prod
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-prod}
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}?serverVersion=${MYSQL_VERSION}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - symfony_network
    restart: unless-stopped

  # Nginx web server
  nginx:
    image: nginx:alpine
    container_name: symfony_nginx_prod
    ports:
      - "8080:80"
      - "8443:443"  # For HTTPS
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # Add SSL certificates here
      # - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem
      # - ./ssl/key.pem:/etc/nginx/ssl/key.pem
    depends_on:
      - php
    networks:
      - symfony_network
    restart: unless-stopped

  # MariaDB database
  database:
    image: mariadb:${MYSQL_VERSION}
    container_name: symfony_database_prod
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "127.0.0.1:3306:3306"  # Only bind to localhost for security
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - symfony_network
    restart: unless-stopped

  # phpMyAdmin (optional - remove in production or secure properly)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: symfony_phpmyadmin_prod
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:8081:80"  # Only bind to localhost for security
    depends_on:
      database:
        condition: service_healthy
    networks:
      - symfony_network
    restart: unless-stopped

volumes:
  database_data:
    driver: local

networks:
  symfony_network:
    driver: bridge
